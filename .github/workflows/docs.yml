name: docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'packages/*/CHANGELOG.md'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - docs/legacy
    paths:
      - 'docs/**'
      - 'packages/*/CHANGELOG.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Nacara downloads the tree-sitter grammars here, once per machine.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nacara
          key: nacara-${{ runner.os }}

      - name: Check the site
        run: ./build.sh docs check --strict --version legacy

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Two deploys writing the branch at once lose one of them.
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Nacara downloads the tree-sitter grammars here, once per machine.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nacara
          key: nacara-${{ runner.os }}

      - name: Build the site
        run: ./build.sh docs build --version legacy

      - name: Publish it
        run: ./build.sh docs deploy
