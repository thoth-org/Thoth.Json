# Build and deploy the documentation website to GitHub Pages.
#
# The deployment uses the official GitHub Pages actions, so each run is recorded
# as a deployment of the `github-pages` environment and is visible from the
# repository "Environments" / "Deployments" pages.
#
# ⚠️ This requires "Settings > Pages > Build and deployment > Source" to be set
# to "GitHub Actions".
name: docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow a single deployment at a time, without cancelling a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'

      - uses: pnpm/action-setup@v6

      - uses: actions/configure-pages@v6

      # Compiles the documented assemblies and builds the website
      - name: Build the documentation
        run: ./build.sh docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
